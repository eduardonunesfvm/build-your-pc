<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BYP - Cadastro</title>
  <link rel="stylesheet" href="../css/cadastro.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>

<body>

  <main class="page">

    <div class="overlay"></div>

    <section class="register-card">

      <header class="register-header">
        <h1 class="logo">BYP</h1>
        <h2 class="subtitle">Cadastro</h2>
      </header>

      <form class="cadastro-form" id="form-cadastro">

         <div class="field">
          <label for="username">Nome <span class="required">*</span></label>
          <input 
            type="text" 
            id="username" 
            placeholder="Digite seu nome"
            required
          >
        </div>

        <div class="field">
          <label for="email">E-mail <span class="required">*</span></label>
          <input 
            type="email" 
            id="email" 
            placeholder="Digite seu E-mail"
            autocapitalize="none"
            required
          >
        </div>

        <div class="field password-field">
          <label for="password">Senha <span class="required">*</span></label>
          <div class="input-wrapper">
            <input 
              type="password" 
              id="password" 
              placeholder="Digite sua senha"
              required
            >
            <button type="button" class="toggle-password">
              👁
            </button>
          </div>
          
          <div class="requisitos-senha" id="requisitos-senha">
            <p id="req-maiuscula" class="invalido">
              <i class="fa-solid fa-circle-xmark"></i> Pelo menos uma letra maiúscula
            </p>
            <p id="req-numero" class="invalido">
              <i class="fa-solid fa-circle-xmark"></i> Pelo menos um número
            </p>
            <p id="req-especial" class="invalido">
              <i class="fa-solid fa-circle-xmark"></i> Pelo menos um caractere especial (!@#$...)
            </p>
          </div>
          </div>

       <div class="field password-field">
          <label for="confirm-password">Confirmar Senha <span class="required">*</span></label>
          <div class="input-wrapper">
            <input 
              type="password" 
              id="confirm-password" 
              placeholder="Confirme sua senha"
              required
            >
            <button type="button" class="toggle-password">
              👁
            </button>
          </div>
        </div>

       <button class="btn">Cadastrar</button>

        <p class="register-text">
          Já possui uma conta? <a href="login.html" class="loginfinal">Faça Login</a>
        </p>

        <div class="sso-divider">
          <span>ou conecte-se com</span>
        </div>

        <div class="sso-buttons">
          <button type="button" class="btn-sso btn-google">
            <i class="fa-brands fa-google"></i> Google
          </button>
          <button type="button" class="btn-sso btn-github">
            <i class="fa-brands fa-github"></i> GitHub
          </button>
        </div>

        <div style="text-align: center; margin-top: 15px;">
          <a href="../html/index.html" class="back-link">Voltar</a>
        </div>

      </form>
    </section>
  </main>

  <div class="modal-alerta-wrapper" id="modal-alerta">
    <div class="modal-alerta-box">
        <div class="modal-alerta-header">
            <i class="fa-solid fa-triangle-exclamation"></i>
            <span>AVISO DO SISTEMA</span>
        </div>
        <div class="modal-alerta-corpo" id="modal-alerta-mensagem">
            Sua senha está fraca! Garanta pelo menos uma letra maiúscula, um número e um caractere especial.
        </div>
        <div class="modal-alerta-footer">
            <button class="btn-modal-ok" onclick="fecharAlerta()">OK</button>
        </div>
    </div>
</div>

  <script src="../js/acessibilidade.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
