<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BYP - Login</title>
  <link rel="stylesheet" href="../css/login.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>

  <main class="page">

    <div class="overlay"></div>

    <section class="login-card">

      <header class="login-header">
        <h1 class="logo">BYP</h1>
        <h2 class="subtitle">Login</h2>
      </header>

      <form class="login-form">

        <div class="field">
          <label for="email">E-mail <span class="required">*</span></label>
          <input 
            type="email" 
            id="email" 
            placeholder="Digite seu E-mail"
            required
          >
        </div>

        <div class="field password-field">
          <label for="password">Senha <span class="required">*</span></label>
          <div class="input-wrapper">
            <input 
              type="password" 
              id="password" 
              placeholder="Digite sua senha"
              required
            >
            <button type="button" class="toggle-password">
              👁
            </button>
          </div>
        </div>

        <div class="forgot-wrapper">
          <a href="recuperacao_senha.html" class="forgot-password">
            Esqueci minha senha
          </a>
        </div>

        <button type="submit" class="btn">Login</button>

        <p class="register-text">
          Não possui uma conta? <a href="cadastro.html" class="cadastrofinal">Cadastre-se</a>
        </p>

        <div class="sso-divider">
          <span>ou conecte-se com</span>
        </div>

        <div class="sso-buttons">
          <button type="button" class="btn-sso btn-google">
            <i class="fa-brands fa-google"></i> Google
          </button>
          <button type="button" class="btn-sso btn-github">
            <i class="fa-brands fa-github"></i> GitHub
          </button>
        </div>

        <div style="text-align: center; margin-top: 15px;">
          <a href="../html/index.html" class="back-link">Voltar</a>
        </div>

      </form>

    </section>
  </main>

  <script src="../js/acessibilidade.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
