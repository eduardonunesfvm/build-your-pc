<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BYP - Login</title>
  <link rel="stylesheet" href="../css/recuperacao.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

  <main class="page">

    <!-- Overlay escuro -->
    <div class="overlay"></div>

    <!-- Card de login -->
    <section class="login-card">

      <header class="login-header">
        <h1 class="logo">BYP</h1>
        <h2 class="subtitle">Esqueceu sua senha?</h2>
        <p>Informe seu e-mail para receber as instruções de recuperação.</p>
      </header>

      <form class="reset-password-form">

        <!-- recuperação de senha -->
        <div class="field">
          <label for="e-mail">E-mail</label>
          <input 
            type="email" 
            id="e-mail" 
            placeholder="Digite seu E-mail para recuperação"
            required
          >
        </div>
          </div>
        </div>

        
        <button type="submit" class="btn primary">
          Enviar
        </button>

      </form>

      <!-- Social -->
      <footer class="login-footer">
        <a href="../html/index.html" class="back-link">Voltar</a>
      </footer>

    </section>
  </main>

</body>
</html>
